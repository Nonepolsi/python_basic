{% extends 'base.html' %}

{% block title %}
  Регистрация
{% endblock %}

{% block body %}
  <div class="container mt-5">
    <form class="col-6 mx-auto" method="post">
      <h3>Регистрация</h3>
      <hr>
      {% csrf_token %}
      {{ form.as_p }}
      <p>Уже есть аккаунт? <a href="{% url 'authapp:login_page' %}">Войти</a> </p>
      <p><button type="submit" class="btn btn-primary">Зарегистрироваться</button></p>
    </form>
  </div>
{% endblock %}
