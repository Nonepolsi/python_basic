{% extends 'base.html' %}

{% block title %}
  Авторизация
{% endblock %}

{% block body %}
  <div class="container mt-5">
    <form class="col-6 mx-auto" method="post">
      <h3>Вход в учетную запись</h3>
      <hr>
      {% csrf_token %}
      {{ form.as_p }}
      <p>Нет аккаунта? <a href="{% url 'authapp:register_page' %}">Зарегистрироваться</a></p>
      <p><button class="btn btn-primary" type="submit">Войти</button></p>
    </form>
  </div>
{% endblock %}
